[project]
name = "rs485harness"
version = "0.1.0"
description = "RS485 test harness for inverter/BMS protocols (Pylontech ASCII, Voltronic, Seplos): analyzer, bridge, simulators"
requires-python = ">=3.11"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "textual>=8"]
tui = ["textual>=8"]

[project.scripts]
rsh = "rs485harness.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rs485harness*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
